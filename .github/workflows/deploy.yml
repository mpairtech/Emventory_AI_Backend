name: Deploy to KVM host (Docker Compose)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc123 or v1.2.3). Leave empty to deploy latest for default branch."
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image reference
        id: img
        run: |
          REPO="ghcr.io/${{ github.repository }}/emventory-ai-backend"
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image=${REPO}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # Default branch tag (from docker/metadata-action in publish workflow)
            # Usually "main" or "master".
            BRANCH="${GITHUB_REF_NAME}"
            if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
              BRANCH="main"
            fi
            echo "image=${REPO}:${BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Write SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -se <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          # Ensure repo files are present (compose + env). You can manage this folder via git clone or rsync.
          test -f docker-compose.prod.yml
          test -f .env.production

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          IMAGE="${IMAGE}" ENV_FILE=".env.production" docker compose -f docker-compose.prod.yml pull
          IMAGE="${IMAGE}" ENV_FILE=".env.production" docker compose -f docker-compose.prod.yml up -d --remove-orphans

          docker image prune -f
          EOF

name: CI

on:
  pull_request:
  push:
    branches: ["main", "master", "stage"]

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      - name: Import check
        env:
          # Minimal env so Settings() can load.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: Search
          DB_USER: postgres
          DB_PASSWORD: postgres
          API_SECRET: ci_dummy_secret
        run: |
          python -c "import app.main; print('import ok')"
          python -m compileall -q app

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: emventory-ai-backend:ci

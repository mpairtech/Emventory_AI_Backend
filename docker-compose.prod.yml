# Production: app + nginx. Database is external (e.g. Neon) via .env DB_* vars.
# Optional bundled Postgres (dev/staging only): docker compose --profile local-db up -d postgres

services:
  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Search}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app_blue
      - app_green
    ports:
      - "${APP_PORT:-5000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d

  app_blue: &app_base
    image: ${IMAGE:-emventory-ai-backend:latest}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}

  app_green:
    <<: *app_base

volumes:
  pg_data:

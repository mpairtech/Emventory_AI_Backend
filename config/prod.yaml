# Production YAML defaults (optional). Real env / .env on the server override these.
# Set APP_ENV=prod to load this file as defaults (see app/core/config.py).

app:
  log_level: INFO
  active_provider: gemini

db:
  # Neon example — copy values from Neon connection string into server .env
  host: ep-xxxx.region.aws.neon.tech
  port: 5432
  name: neondb
  user: your_neon_user
  password: change_me
  ssl: auto
